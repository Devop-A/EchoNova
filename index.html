
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECHO NOVA | Official Website</title>

    <!-- Load our Tailwind stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Load our JavaScript -->
    <script src="script.js" defer></script>
</head>

<body class="bg-[#10101C] text-white min-h-screen">

    
<!-- Website Header -->
<header class="sticky top-0 z-50 bg-[#191625]/95 border-b border-purple-500/20 backdrop-blur-md">

    <!-- Navigation Container -->
    <nav class="max-w-6xl mx-auto px-6 py-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between" aria-label="Main navigation">

        <!-- Artist Branding -->
        <a href="#home" class="text-2xl font-bold tracking-widest text-purple-400">
            ECHO NOVA
        </a>

        <!-- Navigation Links -->
        <div class="flex flex-wrap items-center gap-5 text-sm text-gray-200">

            <a href="#home" class="hover:text-purple-400 transition-colors">
                Home
            </a>

            <a href="#music" class="hover:text-purple-400 transition-colors">
                Music
            </a>

            <a href="#about" class="hover:text-purple-400 transition-colors">
                About
            </a>

            <a href="#shows" class="hover:text-purple-400 transition-colors">
                Shows
            </a>

            <a href="#contact" class="hover:text-purple-400 transition-colors">
                Contact
            </a>

        </div>

    </nav>

</header>


    <main class="text-center p-10">

        <h2 class="text-4xl font-bold mb-4">
            SOUND WITHOUT LIMITS.
        </h2>

        <p class="text-gray-400 mb-8">
            Music shaped by shadow, light, and atmosphere.
        </p>

        <button
            id="test-button"
            type="button"
            class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg cursor-pointer">
            Click Me
        </button>

        <p id="message" class="mt-6 text-purple-300" aria-live="polite"></p>

    </main>

</body>
</html>
