
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECHO NOVA | Official Website</title>

    <!-- Load our Tailwind stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Load our JavaScript -->
    <script src="script.js" defer></script>
</head>

<body class="bg-[#10101C] text-white min-h-screen">

    
<!-- Website Header -->
<header class="sticky top-0 z-50 bg-[#191625]/95 border-b border-purple-500/20 backdrop-blur-md">

    <!-- Navigation Container -->
    <nav class="max-w-6xl mx-auto px-6 py-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between" aria-label="Main navigation">

        <!-- Artist Branding -->
        <a href="#home" class="text-2xl font-bold tracking-widest text-purple-400">
            ECHO NOVA
        </a>

        <!-- Navigation Links -->
        <div class="flex flex-wrap items-center gap-5 text-sm text-gray-200">

            <a href="#home" class="hover:text-purple-400 transition-colors">
                Home
            </a>

            <a href="#music" class="hover:text-purple-400 transition-colors">
                Music
            </a>

            <a href="#about" class="hover:text-purple-400 transition-colors">
                About
            </a>

            <a href="#shows" class="hover:text-purple-400 transition-colors">
                Shows
            </a>

            <a href="#contact" class="hover:text-purple-400 transition-colors">
                Contact
            </a>

        </div>

    </nav>

</header>


    
<main>

    <!-- HERO SECTION -->
    <section
        id="home"
        class="relative flex min-h-[85vh] items-center justify-center overflow-hidden bg-[#10101C] px-6 py-24 text-center"
    >

        <!-- Background Image -->
        <div
            class="absolute inset-0 bg-cover bg-center opacity-50"
            style="background-image: url('assets/images/echo-nova-hero.jpg');"
            aria-hidden="true"
        ></div>

        <!-- Dark Gradient Overlay -->
        <div
            class="absolute inset-0 bg-gradient-to-b from-[#10101C]/70 via-purple-950/40 to-[#10101C]"
            aria-hidden="true"
        ></div>

        <!-- Hero Content -->
        <div class="relative z-10 mx-auto max-w-4xl">

            <!-- Small Subtitle -->
            <p class="mb-5 text-sm font-semibold uppercase tracking-[0.3em] text-purple-400">
                The Sound of the Unknown
            </p>

            <!-- Main Headline -->
            <h1 class="mb-6 text-5xl font-extrabold tracking-tight text-white md:text-7xl">
                SOUND WITHOUT LIMITS.
            </h1>

            <!-- Description -->
            <p class="mx-auto mb-10 max-w-2xl text-lg leading-relaxed text-gray-300">
                Immersive electronic music shaped by shadow,
                light, and atmosphere.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-wrap justify-center gap-4">

                <a
                    href="#music"
                    class="rounded-lg bg-purple-600 px-8 py-3 font-semibold text-white transition-colors hover:bg-purple-700"
                >
                    Explore Music
                </a>

                <a
                    href="#about"
                    class="rounded-lg border border-purple-400 px-8 py-3 font-semibold text-purple-200 transition-colors hover:bg-purple-500/20"
                >
                    About the Artist
                </a>

            </div>

        </div>

    </section>

</main>


</body>
</html>
